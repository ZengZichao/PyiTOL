version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # pip 生态的 ignore/update-types 必须显式给出 dependency-name，
    # 否则 Dependabot 报 "did not contain a required property of 'dependency-name'"。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-pip-bumps:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    # 屏蔽 major 升级：action 跨大版本会更换 Node 运行时
    # （如 actions/checkout 4→7 从 Node 20 跳到 Node 24），
    # 未经人工验证直接合并会破坏 CI 流水线。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
