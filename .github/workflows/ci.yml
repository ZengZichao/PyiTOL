name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # macOS runner 排队延迟最高（实测可占整个 run 的 2/3 以上），
          # 只在支持范围的边界版本上验证：3.10（下限）与 3.13（当前上限）。
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'

    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      # Force UTF-8 mode on all platforms (incl. Windows, whose default text
      # encoding is cp1252). This makes every read_text()/open() in the test
      # suite decode source files with non-ASCII (e.g. Chinese docstrings)
      # correctly without having to annotate each call with encoding="utf-8".
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/pyitol

      - name: Run self-test
        run: pyitol self-test

      - name: Run tests
        run: pytest tests/ --cov=pyitol --cov-report=xml -m "not integration"

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          # 未配置 CODECOV_TOKEN 时上传会被跳过/降级，不应阻塞 CI；
          # 覆盖率门槛由 pytest 的 --cov-fail-under=80 在本地强制。
          fail_ci_if_error: false

  # 单一汇总 job，作为分支保护里的 required status check：
  # 矩阵增删组合时无需同步修改保护规则。
  gate:
    name: CI gate
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix job failed
        if: needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1

      - name: All matrix jobs passed
        run: echo "CI passed on all matrix combinations"
