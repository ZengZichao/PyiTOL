name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      # Force UTF-8 mode on all platforms (incl. Windows, whose default text
      # encoding is cp1252). This makes every read_text()/open() in the test
      # suite decode source files with non-ASCII (e.g. Chinese docstrings)
      # correctly without having to annotate each call with encoding="utf-8".
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/pyitol

      - name: Run self-test
        run: pyitol self-test

      - name: Run tests
        run: pytest tests/ --cov=pyitol --cov-report=xml -m "not integration"

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
