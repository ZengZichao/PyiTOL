name: Publish to PyPI

# Builds sdist + wheel and publishes to PyPI using Trusted Publishing (OIDC),
# so no API token needs to be stored as a secret.
#
# Prerequisites (one-time, in your PyPI account):
#   PyPI -> Account settings -> Publishing -> Add a new trusted publisher
#     - PyPI project name: pyitol
#     - Owner: ZengZichao
#     - Repository name: pyitol
#     - Workflow name: publish.yml
#     - Environment name: (leave blank or set to "pypi")
#
# Then create an annotated tag and push it:
#   git tag -a v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 发布前先跑一遍单机快速测试，避免把明显坏的代码发上 PyPI
  #（tag 指向的 commit 是否通过完整矩阵由 main 的分支保护保证）。
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools_scm needs the full history and tags to derive the version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -m "not integration"

  build-and-publish:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    # OIDC trusted publishing requires the id-token permission.
    # 注意：不要在这里加 environment: pypi —— PyPI 侧的 Trusted Publisher
    # 是按"环境留空"配置的，两边必须一致。
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools_scm needs the full history and tags to derive the version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token: relies on the PyPI Trusted Publisher configured
        # for this repository + workflow above.
