name: Publish to PyPI

# Builds sdist + wheel and publishes to PyPI using Trusted Publishing (OIDC),
# so no API token needs to be stored as a secret.
#
# Prerequisites (one-time, in your PyPI account):
#   PyPI -> Account settings -> Publishing -> Add a new trusted publisher
#     - PyPI project name: pyitol
#     - Owner: <your GitHub owner, i.e. the OWNER placeholder value>
#     - Repository name: pyitol
#     - Workflow name: publish.yml
#     - Environment name: (leave blank or set to "pypi")
#
# Then create an annotated tag and push it:
#   git tag -a v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # OIDC trusted publishing requires the id-token permission.
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools_scm needs the full history and tags to derive the version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token: relies on the PyPI Trusted Publisher configured
        # for this repository + workflow above.
