name: Deploy docs to GitHub Pages

# Builds the mkdocs site and publishes it to GitHub Pages.
# Site URL: https://zengzichao.github.io/PyiTOL/
# Triggered on pushes to main that touch docs/ or mkdocs.yml, or manually.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdocs.yml

      - name: Install mkdocs
        # 限定大版本范围，避免上游发新版导致文档构建静默漂移。
        run: python -m pip install --upgrade pip "mkdocs>=1.6,<2" "mkdocs-material>=9,<10"

      - name: Build site
        run: mkdocs build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
