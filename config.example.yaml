# PyiTOL 配置文件模板
#
# 用法：
#   cp config.example.yaml pyitol_config.yaml
#   编辑 pyitol_config.yaml 后通过 --config pyitol_config.yaml 加载
#
# 参数优先级：命令行 (CLI) > 配置文件 (Config) > 默认值 (Default)
# 任何在命令行中显式指定的参数都会覆盖配置文件中的对应值。

# ============================================================================
# API 密钥配置
# ============================================================================

# API 密钥文件路径（内容为纯文本 iTOL API Key）
# 也可通过环境变量 ITOL_API_KEY 或命令行 --api-key 设置
api_key_file: .itolapi.key

# ============================================================================
# 导出设置
# ============================================================================

# 默认导出格式：svg / png / pdf / tiff / eps / newick / nexus / phyloxml
default_format: svg

# 默认输出目录
output_directory: .

# ============================================================================
# 文件目录
# ============================================================================

# 模板文件目录（留空则使用当前目录）
template_directory: ''

# 树文件目录（留空则使用当前目录）
tree_directory: ''

# ============================================================================
# 日志设置
# ============================================================================

# 日志级别：DEBUG / INFO / WARNING / ERROR / CRITICAL
# log_level: INFO

# 日志文件路径（同时输出到控制台和文件，留空则仅控制台）
# log_file: pyitol.log

# ============================================================================
# 树解析设置
# ============================================================================

# 多棵树处理策略：ask / first / last / random / split / all
# multi_tree_mode: ask

# 分类学命名格式：auto / gtdb / embedded / ncbi / underscore / mixed
# name_format: auto

# 嵌入式格式解析策略：segment (正向匹配) / reverse (严格逆序) / greedy (从首个_d_截取)
# taxonomy_delimiter_mode: segment

# 混合来源优先级：embedded (树名优先) / table (表格优先)
# taxonomy_source_priority: table
